<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blitzcrank Controller</title>
  <link rel="icon" type="image/x-icon" href="/blitzcrank.ico?v=2">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  
  <div class="arcade-panel">
    <!-- Moved mode switch to top right corner -->
    <div class="mode-switch-container">
      <span class="mode-label">FÍSICO</span>
      <label class="switch">
        <input type="checkbox" id="modeSwitch">
        <span class="switch-slider"></span>
      </label>
      <span class="mode-label">WEB</span>
    </div>

    <div class="header">
      <h1>Blitzcrank Controller</h1>
      <div class="status">
        <span class="status-indicator"></span>
        <span id="statusText">WEB CONTROL DISABLED</span>
      </div>
    </div>

    <div class="main-grid">
      <div class="controls">
        <div class="vertical-control">
          <div class="buttons">
            <div class="button-wrapper">
              <button id="btnUp" class="control-button btn-up" disabled>UP</button>
              <span class="hold-indicator">HOLD TO CONTINUE</span>
            </div>
            <div class="button-wrapper">
              <button id="btnDown" class="control-button btn-down" disabled>DOWN</button>
              <span class="hold-indicator">HOLD TO CONTINUE</span>
            </div>
          </div>
        </div>

        <div class="slider-container">
          <h2 class="control-title">GRIPPER CONTROL</h2>
          <input type="range" min="0" max="100" value="50" class="slider" id="gripperSlider" disabled>
          <div class="slider-labels">
            <span class="closed">CLOSED</span>
            <span id="gripperValue">50%</span>
            <span class="open">OPEN</span>
          </div>
        </div>
      </div>

      <div class="joystick-area">
        <div class="joystick-container" id="joystickContainer">
          <div class="joystick-stick" id="joystickStick"></div>
        </div>
        <div class="joystick-values">
          X: <span id="joystickX">512</span> | Y: <span id="joystickY">512</span>
        </div>
      </div>
    </div>
  </div>

  <script src="/script.js"></script>
</body>
</html>
