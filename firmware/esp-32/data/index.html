<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blitzcrank Controller</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  
  <div class="arcade-panel">
    <div class="header">
      <h1>Blitzcrank Controller</h1>
      <div class="status">
        <span class="status-indicator"></span>
        <span>SYSTEM READY</span>
      </div>
    </div>

    <div class="main-grid">
      <div class="controls">
        <div class="vertical-control">
          <div class="buttons">
            <div class="button-wrapper">
              <button id="btnUp" class="control-button btn-up">UP</button>
              <span class="hold-indicator">HOLD TO CONTINUE</span>
            </div>
            <div class="button-wrapper">
              <button id="btnDown" class="control-button btn-down">DOWN</button>
              <span class="hold-indicator">HOLD TO CONTINUE</span>
            </div>
          </div>
        </div>

        <div class="slider-container">
          <h2>GRIPPER CONTROL</h2>
          <input type="range" min="0" max="100" value="50" class="slider" id="gripperSlider">
          <div class="slider-labels">
            <span class="closed">CLOSED</span>
            <span id="gripperValue">50%</span>
            <span class="open">OPEN</span>
          </div>
        </div>
      </div>

      <div class="joystick-area">
        <div class="joystick-container" id="joystickContainer">
          <div class="joystick-stick" id="joystickStick"></div>
        </div>
        <div class="joystick-values">
          X: <span id="joystickX">0</span> | Y: <span id="joystickY">0</span>
        </div>
      </div>
    </div>
  </div>

  <script src="/script.js"></script>
</body>
</html>
